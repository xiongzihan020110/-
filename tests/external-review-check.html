<!doctype html><meta charset="utf-8"><title>外链精听回归</title><style>body{margin:0;background:#10161e;color:#d9edf4;font:14px sans-serif}header{height:70px;padding:10px 18px;box-sizing:border-box}button{padding:8px;margin-right:12px}iframe{width:100%;height:calc(100dvh - 70px);border:0;display:block}#result{display:inline}</style>
<header><button id="check">验证布局与录音回听</button><span id="result">测试只用本地生成的音频，不访问麦克风。</span></header><iframe id="app" src="/index.html?qa=review-layout"></iframe>
<script type="module">
const frame=document.querySelector('#app'),result=document.querySelector('#result');const check=(value,message)=>{if(!value)throw Error(message);};
document.querySelector('#check').onclick=async()=>{try{const w=frame.contentWindow,d=w.document,api=w.classbridgeReviewQA;if(!api)throw Error('页面尚未就绪，请稍后点击');await api.show(false);check(d.querySelector('#liveSetup').hidden,'载入后设置没有收起');check(d.querySelector('#timer').hidden,'错误地把录音时长当视频时钟展示');check([...d.querySelectorAll('.sentence-actions button')].every(b=>b.disabled),'无录音时出现可回听按钮');await api.show(true);const src=d.querySelector('#networkPlayer').src;await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('录音回听加载超时')),10000);d.querySelector('#recordingPlayer').addEventListener('loadedmetadata',()=>{clearTimeout(timer);resolve();},{once:true});d.querySelector('.sentence-actions button').click();});const audio=d.querySelector('#recordingPlayer');check(d.querySelector('#networkPlayer').src===src,'回听关闭或替换了原视频');check(audio.paused,'回听录音不应自动与视频同时播放');check(Math.abs(audio.duration-2)<.05,'录音片段没有正确裁剪为所选句子');check(d.querySelector('#externalCaptureState').textContent==='实时翻译已暂停','状态混淆');result.textContent='PASS · 设置收起、时钟区分、未录音禁用回听、视频保留、2 秒录音片段不自动播放';}catch(e){result.textContent='FAIL · '+e.message;}};
</script>
