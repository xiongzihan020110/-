<!doctype html><meta charset="utf-8"><title>录音存储验证</title><button id="run">运行合成录音验证</button><pre id="result">尚未运行</pre><video id="practicePlayer" controls></video><select id="playbackRate"><option value="1">1</option></select><input id="loopSentence" type="checkbox"><button id="stopPlayback">停止</button><p id="practiceLabel"></p><script type="module">
import {beginRecording,recordSamples,finishRecording,initializePlayer,playRange} from '../dist/media-library.js';import {sessionAssets,deleteSession} from '../dist/media-store.js';
initializePlayer();document.getElementById('run').onclick=async()=>{const id='qa-synthetic-recording';try{await deleteSession(id);await beginRecording(id,0,true,message=>{throw new Error(message);});for(let j=0;j<48;j++){const a=new Float32Array(2048);for(let i=0;i<a.length;i++)a[i]=Math.sin((j*2048+i)*2*Math.PI*440/16000)*.1;recordSamples(a);}await finishRecording();const all=await sessionAssets(id);if(all.length!==2)throw Error('Expected two persistent recording chunks');const bytes=all.reduce((n,a)=>n+a.blob.size,0);if(bytes!==48*2048*2)throw Error('Recorded sample count mismatch');await playRange({start:4.5,end:5.5,original:'合成录音跨片段回放'},id);document.getElementById('result').textContent=`PASS · ${all.length} 个录音块，${bytes} 字节，跨块回放已启动`;}catch(e){document.getElementById('result').textContent='FAIL '+e.message;}};
</script>
<button id="stream">验证流式导入</button><pre id="streamResult"></pre><script type="module">
import {processFile} from '../dist/file-import.js';document.getElementById('stream').onclick=async()=>{try{let count=0,end=0;const blob=await(await fetch('../dist/sample.wav')).blob();await processFile(new File([blob],'stream-test.wav',{type:'audio/wav'}),async job=>{count++;end=job.end;},(p,d)=>document.getElementById('streamResult').textContent=`读取 ${p.toFixed(2)} / ${d.toFixed(2)}`,new AbortController().signal,{stream:true});document.getElementById('streamResult').textContent=`PASS · 流式读取 ${count} 段，结束 ${end.toFixed(2)} 秒`;}catch(e){document.getElementById('streamResult').textContent='FAIL '+e.message;}};
</script>
<button id="video">生成测试视频</button><a id="downloadVideo" hidden>下载测试视频</a><pre id="videoResult"></pre><script type="module">
document.getElementById('video').onclick=async()=>{try{const ctx=new AudioContext(),buffer=await ctx.decodeAudioData(await(await fetch('../dist/sample.wav')).arrayBuffer()),destination=ctx.createMediaStreamDestination(),source=ctx.createBufferSource();source.buffer=buffer;source.connect(destination);const canvas=document.createElement('canvas');canvas.width=640;canvas.height=360;const draw=canvas.getContext('2d');draw.fillStyle='#176b57';draw.fillRect(0,0,640,360);draw.fillStyle='white';draw.font='30px sans-serif';draw.fillText('ClassBridge video import test',60,180);const stream=new MediaStream([...canvas.captureStream(10).getVideoTracks(),...destination.stream.getAudioTracks()]),recorder=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp8,opus'}),chunks=[];recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>{const link=document.getElementById('downloadVideo');link.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));link.download='classbridge-test-video.webm';link.hidden=false;document.getElementById('videoResult').textContent='测试视频已生成';stream.getTracks().forEach(t=>t.stop());ctx.close();};recorder.start();source.onended=()=>recorder.stop();await ctx.resume();source.start();document.getElementById('videoResult').textContent='正在生成真实音轨测试视频…';}catch(e){document.getElementById('videoResult').textContent='FAIL '+e.message;}};
</script>
